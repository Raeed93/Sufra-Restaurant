# Production stack. Run from the project root:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Only the web container is published, and only on 127.0.0.1:8300.
# The host's nginx terminates HTTPS and proxies the domain to it.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sufra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: sufra
    volumes:
      - sufra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sufra"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://sufra:${POSTGRES_PASSWORD}@db:5432/sufra
      GROQ_API_KEY: ${GROQ_API_KEY:?set GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:?set GROQ_MODEL}
      GROQ_FALLBACK_MODEL: ${GROQ_FALLBACK_MODEL:-}
      REASONING_EFFORT: ${REASONING_EFFORT:-}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      COOKIE_SECURE: "true"
      SAFETY_MODE: ${SAFETY_MODE:-on}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8300:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sufra_pgdata:
