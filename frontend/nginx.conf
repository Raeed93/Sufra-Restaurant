# Serves the React app and forwards /api to FastAPI, so the browser sees one origin.
# TLS is handled by the host's nginx in front of this container.

# Rate limits per client IP: protects the Groq bill and slows password guessing.
limit_req_zone $binary_remote_addr zone=chat:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 16k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /api/chat {
        limit_req zone=chat burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        include /etc/nginx/conf.d/proxy_headers.inc;
        proxy_read_timeout 90s;
    }

    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    # Caching uses "expires", not add_header: an add_header inside a location
    # would stop the security headers above from being sent for that location.

    # Hashed build files never change, so browsers can cache them for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Everything else is the single-page app; always revalidate index.html.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
